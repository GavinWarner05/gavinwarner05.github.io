name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Baseline refresh when games are unlikely to be active.
    - cron: "7 * * * *"
    # Broad NFL windows in UTC: Sunday international/daytime/evening games.
    - cron: "*/5 13-23 * * 0"
    # Late-season Saturday daytime/evening games.
    - cron: "*/5 17-23 * * 6"
    # UTC after-midnight windows covering Thu/Sat/Sun/Mon night games in US time.
    - cron: "*/5 0-5 * * 0,1,2,5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install synchronization dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true
      - name: Test public data boundary
        run: python -m unittest discover -s tests -v
      - name: Synchronize NFL and Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TEAMS_DATABASE_ID: ${{ vars.NOTION_TEAMS_DATABASE_ID }}
          NOTION_GAMES_DATABASE_ID: ${{ vars.NOTION_GAMES_DATABASE_ID }}
          NOTION_INJURIES_DATABASE_ID: ${{ vars.NOTION_INJURIES_DATABASE_ID }}
          NOTION_TEAMS_DATA_SOURCE_NAME: ${{ vars.NOTION_TEAMS_DATA_SOURCE_NAME }}
          NOTION_GAMES_DATA_SOURCE_NAME: ${{ vars.NOTION_GAMES_DATA_SOURCE_NAME }}
          NOTION_INJURIES_DATA_SOURCE_NAME: ${{ vars.NOTION_INJURIES_DATA_SOURCE_NAME }}
          NOTION_API_VERSION: ${{ vars.NOTION_API_VERSION }}
          NOTION_FAVORITE_PROPERTY: ${{ vars.NOTION_FAVORITE_PROPERTY }}
          NOTION_AWAY_JERSEY_PROPERTY: ${{ vars.NOTION_AWAY_JERSEY_PROPERTY }}
          NOTION_HOME_JERSEY_PROPERTY: ${{ vars.NOTION_HOME_JERSEY_PROPERTY }}
          NOTION_PUBLIC_NOTES_PROPERTY: ${{ vars.NOTION_PUBLIC_NOTES_PROPERTY }}
          SPORTS_SOURCE_OUTPUT: ${{ runner.temp }}/sports-source.json
          SPORTS_EXPORT_ONLY: "true"
        run: python scripts/sync.py
      - name: Build sanitized sports snapshot
        run: python scripts/build_sports_data.py --input "${RUNNER_TEMP}/sports-source.json" --output static/sports/data/nfl.json
      - name: Build sanitized team snapshots
        run: python scripts/build_team_data.py --input-dir "${RUNNER_TEMP}/sports-teams" --output-dir static/sports/data/teams
      - name: Build Hugo
        run: hugo --environment production --minify --destination public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
